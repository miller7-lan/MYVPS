[Service]
ExecStart=
ExecStart=/opt/dazzle-vps/current/venv/bin/python -I -m deployment.certsync --source-cert /etc/letsencrypt/live/@CERTBOT_LINEAGE@/fullchain.pem --source-key /etc/letsencrypt/live/@CERTBOT_LINEAGE@/privkey.pem --managed-certbot-source
ReadOnlyPaths=
ReadOnlyPaths=/etc/letsencrypt/live /etc/letsencrypt/archive
ReadWritePaths=/etc/dazzle-vps/tls /etc/dazzle-vps/web-tls
