name: Validate templates and subscription service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local backend and native protobuf runtime
        run: python -m pip install "./backend[native]"
      - name: V3.1 isolated backend tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: Parallel deployment safety tests
        run: PYTHONPATH=backend:. python -m unittest discover -s deployment/tests -v
      - name: Subscription behavior tests
        run: python -m unittest discover -s subscription -p test_server.py -v
      - name: Parse JSON and check shell syntax
        run: |
          python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
          sh -n server/hooks/renew-certificate.sh

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native app tests
        run: bash macos/test-app.sh
      - name: Build server management app
        run: bash macos/build-app.sh
