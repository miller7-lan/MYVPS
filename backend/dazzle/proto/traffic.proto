syntax = "proto3";
package daemon;
message SubscribeStatusRequest { int64 interval = 1; }
message Status {
  uint64 memory = 1;
  int32 goroutines = 2;
  int32 connectionsIn = 3;
  int32 connectionsOut = 4;
