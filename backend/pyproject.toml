[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dazzle-vps"
version = "3.1.0"
description = "Local-first private proxy quota and audit manager"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
native = ["protobuf>=7.35.1,<8"]
test-proto = ["grpcio-tools>=1.76,<2"]

[project.scripts]
dazzle-vps = "dazzle.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dazzle*"]

[tool.setuptools.package-data]
"dazzle.proto" = ["*.proto"]
